[package]
name = "apex-maintenance"
version = "0.1.0"
description = "Apex Transport — maintenance, chassis & tire management desktop client"
authors = ["Apex Transport"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "apex_maintenance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"

# Serde / JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# SQLite — synchronous from the Rust side per architecture §11
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# JWT — we only need to read `exp` from the unverified payload, so plain
# base64 + serde_json is enough. Server is the only signer/verifier.
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "1"
anyhow = "1"

# Cross-platform OS keychain (Keychain / Credential Manager / Secret Service)
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# Misc
once_cell = "1"
parking_lot = "0.12"

[features]
# By default Tauri runs in production mode unless `dev` is set
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
