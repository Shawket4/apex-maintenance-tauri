name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon Mac
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel Mac
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux (AppImage & deb)
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest" # Windows (msi & exe)
            target: "x86_64-pc-windows-msvc"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri v2 requires specific WebKit dependencies on Linux
      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM dependencies
        run: npm install

      # This action automatically builds the app and attaches the
      # installers (.dmg, .app, .exe, .msi, .AppImage, .deb) to the GitHub release
      - name: Build and Upload Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Apex Maintenance ${{ github.ref_name }}"
          releaseBody: "Automated release generated by GitHub Actions."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
